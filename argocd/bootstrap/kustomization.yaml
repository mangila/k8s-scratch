apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml

helmCharts:
  - name: argo-cd
    repo: oci://ghcr.io/argoproj/argo-helm
    version: 10.18.1
    releaseName: argocd
    apiVersions:
      - monitoring.coreos.com/v1
    valuesFile: argocd-values.yaml
