apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: k8s-scratch
  source:
      repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.18.1
      helm:
        apiVersions:
          - monitoring.coreos.com/v1
        valuesObject:
          configs:
            params:
              server.insecure: false
          controller:
            metrics:
              enabled: true
          server:
            replicas: 1
            service:
              type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
